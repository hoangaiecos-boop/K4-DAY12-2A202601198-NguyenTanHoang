name: CI

# Chạy cả khi push lẫn khi mở pull request: bắt lỗi TRƯỚC lúc merge mới là mục
# đích chính của CI, chờ tới lúc đã vào main thì đã muộn.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bỏ qua test_cp5.py: nó gọi HTTP vào bản deploy thật nên trong CI luôn đỏ.
      # Bỏ qua test_bonus_cicd.py: nó kiểm tra badge đã "passing" chưa — chạy nó
      # ở đây là vòng luẩn quẩn, badge chỉ xanh sau khi chính lần chạy này xong.
      - name: Chạy test
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Dockerfile hỏng mà tới lúc deploy mới biết là quá muộn.
      - name: Build Docker image
        run: docker build -t day12-chat:ci .

      - name: Đo dung lượng image
        run: docker images day12-chat:ci --format '{{.Size}}'

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # `needs` biến workflow thành cổng chất lượng: test hoặc build đỏ thì
    # deploy không chạy. Không có nó, GitHub chạy song song và code hỏng vẫn lên.
    needs: [test, build]
    # Chỉ deploy từ nhánh chính, và chỉ khi thật sự push — mở pull request
    # không được kéo theo một lần deploy lên production.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Gọi deploy hook của Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Chưa đặt secret RENDER_DEPLOY_HOOK — bỏ qua bước deploy"
            exit 0
          fi
          curl -fsS "$RENDER_DEPLOY_HOOK"
          echo "Đã yêu cầu Render deploy commit ${GITHUB_SHA::7}"
